<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="appleTitle" content="小猴子成长记">
<meta name="theme-color" content="#FCF9F4">
<meta name="format-detection" content="telephone=no">
<title>小猴子成长记</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #FCF9F4;
  --card: #FFFFFF;
  --ink: #2C2620;
  --ink2: #6B6259;
  --ink3: #A79D91;
  --line: #EDE5D9;
  --line2: #E2D8C9;
  --accent: #C9722F;
  --accent-soft: #FCF0E1;
  --green: #2E8B6E;
  --green-soft: #E6F3EE;
  --blue: #3A6FA8;
  --blue-soft: #E9F0F8;
  --rose: #B5566B;
  --rose-soft: #FAECEF;
  --violet: #7A5AA8;
  --violet-soft: #F1ECF9;
  --amber: #A97A1F;
  --amber-soft: #FBF3DE;
  --r: 14px;
  --r-lg: 18px;
  --shadow: 0 1px 2px rgba(80, 60, 40, .04), 0 6px 18px rgba(80, 60, 40, .05);
}

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

.app { max-width: 540px; margin: 0 auto; padding: 0 16px 96px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(252, 249, 244, .92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  margin: 0 -16px; padding: 14px 16px 10px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
.brand small { font-weight: 400; color: var(--ink3); font-size: 12px; margin-left: 6px; letter-spacing: 0; }
.icon-btn {
  border: 0; background: transparent; color: var(--ink2); padding: 6px 8px;
  font-size: 13px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.icon-btn:active { background: var(--line); }

.page { display: none; padding-top: 16px; }
.page.on { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.card.tight { padding: 12px 14px; }
.card-title { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.card-sub { font-size: 12px; color: var(--ink3); margin: 0 0 12px; line-height: 1.55; }
/* 连接检查结果 */
.sync-msgs { margin-top: 10px; }
.sync-msgs .chk {
  font-size: 12px; line-height: 1.6; padding: 6px 10px; border-radius: 9px;
  margin-bottom: 5px; word-break: break-all;
}
.sync-msgs .chk.ok { background: #F1F6EE; color: #4A7A48; }
.sync-msgs .chk.bad { background: #FBEFEC; color: #A84B36; }

/* 同步状态 */
.sync-state {
  display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px;
  background: #F3F7F0; border: 1px solid #DDE8D6; border-radius: 12px; padding: 10px 12px;
  font-size: 12px; color: var(--ink2);
}
.sync-state b { font-size: 12.5px; color: #4A7A48; }
.sync-state.off { background: #F7F4EF; border-color: var(--line); color: var(--ink3); }

/* 记录日期 */
.datebar {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 12px; padding: 8px 8px 8px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
}
.db-left { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.db-cap { font-size: 12px; color: var(--ink3); flex: 0 0 auto; }
.db-left input[type=date] {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 4px 0;
  font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .3px;
}
.db-left input[type=date]:focus { background: transparent; }
.db-today {
  flex: 0 0 auto; border: 1px solid var(--line2); background: #fff; color: var(--accent);
  border-radius: 10px; padding: 7px 12px; font-size: 12.5px; font-family: inherit; font-weight: 500;
}
.db-today:active { background: var(--line); }
.db-today.dim { color: var(--ink3); border-color: var(--line); background: transparent; font-weight: 400; }
.backfill {
  font-size: 12px; line-height: 1.65; color: #8A6A3E; background: #FBF1DF;
  border: 1px solid #F0DFC2; border-radius: 12px; padding: 9px 12px; margin: 0 0 12px;
}
.backfill b { display: block; color: #7A5626; font-size: 12.5px; margin-bottom: 2px; }

.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
.sec-head h2 { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0; letter-spacing: .5px; }
.sec-head .more { font-size: 12px; color: var(--ink3); }

textarea, input[type=text], input[type=date], select {
  width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
  background: #FDFBF7; border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; outline: none; transition: border-color .15s, background .15s;
  -webkit-appearance: none; appearance: none;
}
textarea { resize: vertical; min-height: 76px; line-height: 1.6; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); background: #fff; }
textarea::placeholder, input::placeholder { color: var(--ink3); }

select { background-image: none; padding-right: 30px; }

.label { font-size: 12px; color: var(--ink3); margin: 14px 0 7px; font-weight: 500; }
.label:first-child { margin-top: 0; }

.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1px solid var(--line2); background: #fff; color: var(--ink2);
  font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-family: inherit; transition: all .15s; line-height: 1.4;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chip.mini { font-size: 12px; padding: 4px 10px; }

.btn {
  border: 1px solid var(--line2); background: #fff; color: var(--ink);
  font-family: inherit; font-size: 14px; padding: 11px 16px; border-radius: 12px;
  cursor: pointer; font-weight: 500; transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:disabled { opacity: .4; }
.btn-block { display: block; width: 100%; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn-sm { font-size: 13px; padding: 8px 12px; border-radius: 10px; }
.btn-full { width: 100%; }

.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood {
  border: 1px solid var(--line2); background: #fff; border-radius: 10px;
  padding: 8px 2px; text-align: center; cursor: pointer; font-family: inherit;
  font-size: 11px; color: var(--ink2); line-height: 1.3; transition: all .15s;
}
.mood b { display: block; font-size: 17px; font-weight: 400; margin-bottom: 2px; }
.mood.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.entry {
  display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line);
}
.entry:last-child { border-bottom: 0; }
.entry-date {
  flex: 0 0 44px; font-size: 11px; color: var(--ink3); line-height: 1.4;
  padding-top: 2px; text-align: center;
}
.entry-date b { display: block; font-size: 16px; font-weight: 500; color: var(--ink2); }
.entry-body { flex: 1; min-width: 0; }
.entry-text { margin: 0 0 6px; white-space: pre-wrap; word-break: break-word; }
.entry-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill {
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--amber-soft); color: var(--amber); line-height: 1.6;
}
.pill.g { background: var(--green-soft); color: var(--green); }
.pill.b { background: var(--blue-soft); color: var(--blue); }
.pill.v { background: var(--violet-soft); color: var(--violet); }
.pill.r { background: var(--rose-soft); color: var(--rose); }
.pill.gray { background: #F3EFE8; color: var(--ink3); }
.del {
  border: 0; background: transparent; color: var(--ink3); font-size: 12px;
  cursor: pointer; padding: 2px 4px; font-family: inherit; opacity: .7;
}
.del:hover { color: var(--rose); }

.empty { text-align: center; color: var(--ink3); font-size: 13px; padding: 26px 12px; line-height: 1.9; }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-inner { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav-item {
  border: 0; background: transparent; padding: 8px 0 10px; cursor: pointer;
  color: var(--ink3); font-family: inherit; font-size: 10.5px; letter-spacing: .3px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.on { color: var(--accent); }
.nav-item.on svg { stroke-width: 1.9; }

.heat { display: grid; grid-template-columns: 1fr; gap: 6px; }
.heat-row { display: grid; grid-template-columns: 92px repeat(4, 1fr); gap: 5px; align-items: center; }
.heat-name { font-size: 11.5px; color: var(--ink2); line-height: 1.3; }
.heat-cell {
  height: 26px; border-radius: 6px; background: #F5F1E9;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; color: var(--ink3);
}
.heat-head { font-size: 10.5px; color: var(--ink3); text-align: center; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 500; letter-spacing: -.5px; }
.stat span { font-size: 11px; color: var(--ink3); }

.acc { border-bottom: 1px solid var(--line); }
.acc:last-child { border-bottom: 0; }
.acc-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 0; cursor: pointer; user-select: none;
}
.acc-head h3 { margin: 0; font-size: 15px; font-weight: 500; }
.acc-head .hint { font-size: 11.5px; color: var(--ink3); }
.acc-body { display: none; padding: 0 0 16px; }
.acc.open .acc-body { display: block; }
.acc-toggle { color: var(--ink3); font-size: 12px; flex: 0 0 auto; }
.acc-toggle::after { content: "展开"; }
.acc.open .acc-toggle::after { content: "收起"; }

.block { margin-bottom: 14px; }
.block:last-child { margin-bottom: 0; }
.block h4 {
  font-size: 12px; margin: 0 0 5px; color: var(--ink3); font-weight: 600;
  letter-spacing: .5px;
}
.block p { margin: 0 0 6px; font-size: 14px; line-height: 1.75; color: #3D362E; }
.block ul { margin: 0; padding-left: 17px; }
.block li { font-size: 14px; line-height: 1.75; margin-bottom: 4px; color: #3D362E; }
.block li::marker { color: var(--ink3); }

.quote {
  border-left: 2px solid var(--accent); background: var(--accent-soft);
  padding: 10px 13px; border-radius: 0 10px 10px 0; margin: 6px 0;
  font-size: 14px; line-height: 1.7; color: #6B4A23;
}

.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap input { padding-left: 34px; }
.search-wrap svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; stroke: var(--ink3); fill: none; stroke-width: 1.8;
}

.scene {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  margin-bottom: 9px; overflow: hidden;
}
.scene-head { padding: 13px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.scene-head h3 { margin: 0; font-size: 14.5px; font-weight: 500; }
.scene-tag { font-size: 10.5px; color: var(--ink3); white-space: nowrap; }
.scene-body { display: none; padding: 0 14px 15px; }
.scene.open .scene-body { display: block; }
.scene.open .scene-head { border-bottom: 1px solid var(--line); }

.sheet-mask {
  position: fixed; inset: 0; background: rgba(40, 30, 20, .35);
  z-index: 50; display: none; align-items: flex-end; justify-content: center;
}
.sheet-mask.on { display: flex; }
.sheet {
  background: #fff; width: 100%; max-width: 540px; border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 86vh; overflow-y: auto;
  animation: up .25s cubic-bezier(.2, .8, .3, 1);
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
.sheet .card-sub { margin-bottom: 16px; }

.toast {
  position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(10px);
  background: #2C2620; color: #fff; font-size: 13px; padding: 9px 16px;
  border-radius: 999px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 60;
  white-space: nowrap;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.pickbar {
  position: sticky; bottom: 76px; z-index: 15;
  background: #fff; border: 1px solid var(--line2); border-radius: 14px;
  padding: 11px 12px; box-shadow: 0 6px 22px rgba(80, 60, 40, .12);
  display: none; margin-top: 12px;
}
.pickbar.on { display: block; }
.pickbar-row { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
.pickbar-row:last-child { margin-bottom: 0; }
.pickbar-label { font-size: 11.5px; color: var(--ink3); flex: 0 0 30px; }
.pickbar .chip { flex: 1; text-align: center; padding: 7px 4px; }

.mini-btn {
  border: 1px solid var(--line2); background: #fff; color: var(--ink2);
  font-family: inherit; font-size: 12px; padding: 5px 10px; border-radius: 9px; cursor: pointer;
}

.divider { height: 1px; background: var(--line); margin: 16px 0; }

.tip { font-size: 12px; color: var(--ink3); line-height: 1.7; }

.seg {
  display: grid; grid-template-columns: 1fr 1fr; background: #F1ECE3;
  border-radius: 12px; padding: 3px; margin-bottom: 16px;
}
.seg button {
  border: 0; background: transparent; padding: 9px 0; border-radius: 9px;
  font-family: inherit; font-size: 13.5px; color: var(--ink2); cursor: pointer; font-weight: 500;
}
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(80, 60, 40, .1); }

.need-row { display: flex; gap: 10px; padding: 11px 0; border-top: 1px dashed var(--line); }
.need-row:first-of-type { border-top: 0; padding-top: 2px; }
.need-rank {
  flex: 0 0 52px; height: 21px; line-height: 21px; text-align: center;
  font-size: 10.5px; color: var(--ink3); background: #F3EFE8; border-radius: 6px;
}
.need-rank.top { background: var(--accent-soft); color: var(--accent); }
.need-body { flex: 1; font-size: 13.5px; line-height: 1.7; }
.need-body b { font-weight: 500; }
.need-body p { margin: 4px 0 0; color: var(--ink2); }

.card.accent { background: var(--accent-soft); border-color: #F0DFC8; }
.card.accent .card-title { color: #8A5A22; }
.card.accent .tip { color: #A8794A; }
.one-action { font-size: 15px; line-height: 1.8; color: #5C3B1A; font-weight: 500; }

.chip.own { position: relative; padding-right: 23px; border-style: dashed; }
.chip.own .x {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--ink3); padding: 0 3px; line-height: 1;
}
.chip.addact { border-style: dashed; color: var(--ink3); }

.beh-row {
  display: flex; gap: 8px; padding: 9px 0; border-top: 1px dashed var(--line);
  cursor: pointer; font-size: 13.5px; align-items: baseline;
}
.beh-row:first-child { border-top: 0; }
.beh-text { flex: 1; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (min-width: 560px) {
  body { font-size: 15.5px; }
  .app { padding-bottom: 110px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span id="brandName">小猴子成长记</span> <small id="brandSub"></small></div>
      <button class="icon-btn" id="btnMenu">设置</button>
    </div>
  </div>
  <main>
    <section class="page on" id="page-today"></section>
    <section class="page" id="page-growth"></section>
    <section class="page" id="page-learn"></section>
    <section class="page" id="page-guide"></section>
    <section class="page" id="page-scene"></section>
  </main>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-item on" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>今天</span>
    </button>
    <button class="nav-item" data-tab="growth">
      <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 6-8"/><path d="M15 7h4v4"/></svg>
      <span>成长</span>
    </button>
    <button class="nav-item" data-tab="learn">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v16H6.5A2.5 2.5 0 004 21.5V5.5z"/><path d="M8.5 7.5h6"/></svg>
      <span>学习</span>
    </button>
    <button class="nav-item" data-tab="guide">
      <svg viewBox="0 0 24 24"><path d="M12 20.5S4.5 16 4.5 10.8A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 3.2c0 5.2-7.5 9.7-7.5 9.7z"/></svg>
      <span>指南</span>
    </button>
    <button class="nav-item" data-tab="scene">
      <svg viewBox="0 0 24 24"><path d="M20.5 14.5a2.5 2.5 0 01-2.5 2.5H9l-4.5 3.5V17H4a1.5 1.5 0 01-1.5-1.5v-9A2.5 2.5 0 015 4h13a2.5 2.5 0 012.5 2.5v8z"/></svg>
      <span>急救</span>
    </button>
  </div>
</nav>

<div class="sheet-mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>/* 小猴子成长记 · 内容库 */

const APP_DATA = {

  child: { name: '小猴子', birthday: '' },

  tags: [
    { k: '玩', cls: '' },
    { k: '学', cls: 'b' },
    { k: '情绪', cls: 'r' },
    { k: '规矩', cls: 'v' },
    { k: '健康', cls: 'g' },
    { k: '社交', cls: '' },
    { k: '户外', cls: 'g' }
  ],

  moods: [
    { k: '兴奋', emo: '😄' },
    { k: '愉快', emo: '🙂' },
    { k: '平静', emo: '😐' },
    { k: '烦躁', emo: '😕' },
    { k: '崩溃', emo: '😭' }
  ],

  domains: [
    {
      id: 'reading', name: '阅读与语言', color: '#3A6FA8', soft: '#E9F0F8',
      acts: ['亲子共读绘本', '自己翻书讲给大人听', '听音频故事', '复述今天发生的事', '认路牌和店名', '编一个故事']
    },
    {
      id: 'math', name: '数感与逻辑', color: '#7A5AA8', soft: '#F1ECF9',
      acts: ['数楼梯和台阶', '比多少、比大小', '分类整理玩具', '拼图', '找规律', '玩桌游', '量一量有多长']
    },
    {
      id: 'english', name: '英语启蒙', color: '#2E8B6E', soft: '#E6F3EE',
      acts: ['英文儿歌', '英文绘本', '日常指令（wash hands 等）', '英文动画片（陪看）', '字母游戏']
    },

<script>/* 小猴子成长记 · 应用逻辑 */

const KEY = 'xiaohouzi.v1';
const VER = '11-04 10:39';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function blank() {
  return {
    v: 1,
    child: { name: '小猴子', birthday: '' },
    me: '',
    entries: [], learn: [], questions: [], repeats: [], books: [], miles: [], reviews: {},
    customActs: [], behaviors: []
  };
}

let S = blank();
let memOnly = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      S = Object.assign(blank(), o);
    }
  } catch (e) {
    memOnly = true;
    S = blank();
  }
}

function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { memOnly = true; }
}
function save() { saveLocal(); queueSync(); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function parseDate(s) { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function weekday(d) { return '周' + '日一二三四五六'[d.getDay()]; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function ageText() {
  if (!S.child.birthday) return '';
  const b = parseDate(S.child.birthday);
  const n = new Date();
  let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) m -= 1;
  if (m < 0) return '';
  const y = Math.floor(m / 12), mm = m % 12;
  return y > 0 ? y + ' 岁 ' + (mm > 0 ? mm + ' 个月' : '') : mm + ' 个月';
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('on'); }, 1900);
}

/* ---------- 导航 ---------- */

let curTab = 'today';

function go(tab) {
  curTab = tab;
  $$('.page').forEach(function (p) { p.classList.remove('on'); });
  $('#page-' + tab).classList.add('on');
  $$('.nav-item').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  window.scrollTo({ top: 0 });
  renderAll();
}

function renderAll() {
  $('#brandSub').textContent = ageText() || '';
  if (curTab === 'today') renderToday();
  if (curTab === 'growth') renderGrowth();
  if (curTab === 'learn') renderLearn();
  if (curTab === 'guide') renderGuide();
  if (curTab === 'scene') renderRescue();
}

/* ---------- 今天 ---------- */

let draftTags = [];
let draftMood = '';
let viewDate = '';            // 空 = 今天；否则为正在补记的日期
let draftNote = '';
let draftWin = '';

function curDate() { return viewDate || today(); }

function renderToday() {
  const d = curDate();
  const isToday = d === today();
  const theDate = parseDate(d);
  const todayEntries = S.entries.filter(function (e) { return e.date === d; })
    .sort(function (a, b) { return b.createdAt - a.createdAt; });
  const todayLearn = S.learn.filter(function (l) { return l.date === d; });

  let h = '';
  h += '<div class="datebar">';
  h += '<div class="db-left"><span class="db-cap">记录日期</span>' +
       '<input type="date" id="dateInput" value="' + d + '" max="' + today() + '"></div>';
  h += '<button class="db-today' + (isToday ? ' dim' : '') + '" id="dateToday">' +
       (isToday ? '今天' : '回今天') + '</button>';
  h += '</div>';
  if (!isToday) {
    h += '<div class="backfill"><b>补记 ' + (theDate.getMonth() + 1) + ' 月 ' + theDate.getDate() +
         ' 日（' + weekday(theDate) + '）</b>记下的内容会排在时间线的这一天，不影响今天。</div>';
  }

  h += '<div class="card">';
  h += '<p class="card-title">' + (isToday ? '今天记一笔' : '补记一笔') + '</p>';
  h += '<p class="card-sub">做了什么、学了什么、让你笑了什么。一句话就够。</p>';
  h += '<textarea id="note" placeholder="例：自己穿好了鞋子，出门一路数到 30。午睡后拼了 24 块拼图，卡住的时候没找我。">' + esc(draftNote) + '</textarea>';
  h += '<div class="label">标签</div><div class="chips" id="tagRow">';
  APP_DATA.tags.forEach(function (t) {
    h += '<button class="chip' + (draftTags.indexOf(t.k) >= 0 ? ' on' : '') + '" data-tag="' + t.k + '">' + t.k + '</button>';
  });
  h += '</div>';
  h += '<div class="label">他的状态</div><div class="moods" id="moodRow">';
  APP_DATA.moods.forEach(function (m) {
    h += '<button class="mood' + (draftMood === m.k ? ' on' : '') + '" data-mood="' + m.k + '"><b>' + m.emo + '</b>' + m.k + '</button>';
  });
  h += '</div>';
  h += '<div class="label">今天我哪件事做对了</div>';
  h += '<input type="text" id="win" placeholder="例：他哭的时候我忍住了没讲道理" value="' + esc(draftWin) + '">';
  h += '<div style="margin-top:14px"><button class="btn btn-primary btn-block" id="saveEntry">' +
       (isToday ? '记下' : '记到 ' + (theDate.getMonth() + 1) + '/' + theDate.getDate()) + '</button></div>';
  h += '</div>';

  if (todayLearn.length) {
    const names = todayLearn.map(function (l) {
      const dm = APP_DATA.domains.filter(function (x) { return x.id === l.domain; })[0];
      return '<span class="pill" style="background:' + dm.soft + ';color:' + dm.color + '">' + dm.name + '</span>';
    }).join('');
    h += '<div class="card tight"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      '<div><div class="card-title" style="margin-bottom:4px">' + (isToday ? '今天' : '这一天') + '学了 ' + todayLearn.length + ' 笔</div><div class="chips">' + names + '</div></div>' +
      '<button class="mini-btn" data-go="learn">查看</button></div></div>';
  }

  if (todayEntries.length) {
    h += '<div class="sec-head"><h2>' + (isToday ? '今天已记' : '这一天已记') + '</h2><span class="more">' + todayEntries.length + ' 条</span></div>';
    h += '<div class="card">';
    todayEntries.forEach(function (e) { h += entryHTML(e, false); });
    h += '</div>';
  } else {
    h += '<div class="empty" style="padding:18px 8px">还没有记录。<br>不用等有感动的时刻，平常的一天也值得留下。</div>';
  }

  $('#page-today').innerHTML = h;

  const ni = $('#note'), wi = $('#win');
  ni.oninput = function () { draftNote = ni.value; };
  wi.oninput = function () { draftWin = wi.value; };
  $('#dateInput').onchange = function () {
    const v = this.value;
    viewDate = (!v || v === today()) ? '' : v;
    renderToday();
    window.scrollTo({ top: 0 });
  };
  $('#dateToday').onclick = function () {
    if (viewDate) { viewDate = ''; renderToday(); window.scrollTo({ top: 0 }); }
  };

  $$('#tagRow .chip').forEach(function (b) {
    b.onclick = function () {
      const k = b.dataset.tag;
      const i = draftTags.indexOf(k);
      if (i >= 0) draftTags.splice(i, 1); else draftTags.push(k);
      b.classList.toggle('on');
    };
  });
  $$('#moodRow .mood').forEach(function (b) {
    b.onclick = function () {
      draftMood = (draftMood === b.dataset.mood) ? '' : b.dataset.mood;
      $$('#moodRow .mood').forEach(function (x) { x.classList.toggle('on', x.dataset.mood === draftMood); });
    };
  });
  $('#saveEntry').onclick = function () {
    const txt = $('#note').value.trim();
    if (!txt) { toast('写一句话再记下'); return; }
    S.entries.push({
      id: uid(), date: d, text: txt, tags: draftTags.slice(), mood: draftMood,
      win: $('#win').value.trim(), author: S.me,
      createdAt: Date.now(), backfill: isToday ? 0 : 1
    });
    save();
    draftTags = []; draftMood = ''; draftNote = ''; draftWin = '';
    renderToday();
    toast(isToday ? '记下了' : '已记到 ' + (theDate.getMonth() + 1) + ' 月 ' + theDate.getDate() + ' 日');
  };
  bindCommon($('#page-today'));
}

function entryHTML(e, withDate) {
  let p = '<div class="entry">';
  if (withDate) {
    const dt = parseDate(e.date);
    p += '<div class="entry-date"><b>' + dt.getDate() + '</b>' + (dt.getMonth() + 1) + '月</div>';
  }
  p += '<div class="entry-body"><p class="entry-text">' + esc(e.text) + '</p><div class="entry-meta">';
  if (e.mood) p += '<span class="pill gray">' + esc(e.mood) + '</span>';
  (e.tags || []).forEach(function (k) {
    const t = APP_DATA.tags.filter(function (x) { return x.k === k; })[0];
    p += '<span class="pill ' + (t ? t.cls : '') + '">' + esc(k) + '</span>';
  });
  if (e.author) p += '<span class="pill gray">' + esc(e.author) + '</span>';
  if (e.note) p += '<span class="pill v">' + esc(e.note) + '</span>';
  if (e.win) p += '<span class="pill g">做对了：' + esc(e.win) + '</span>';
  p += '<button class="del" data-del-entry="' + e.id + '">删除</button>';
  p += '</div></div></div>';
  return p;
}

/* ---------- 成长 ---------- */

let growthFilter = '';

function renderGrowth() {
  const total = S.entries.length;
  const days = {};
  S.entries.forEach(function (e) { days[e.date] = 1; });
  const dayCount = Object.keys(days).length;

  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    if (days[dstr(d)]) streak++;
    else if (i > 0) break;
  }

  let h = '';
  h += '<div class="card"><div class="stat-row">';
  h += '<div class="stat"><b>' + dayCount + '</b><span>记录天数</span></div>';
  h += '<div class="stat"><b>' + total + '</b><span>累计条目</span></div>';
  h += '<div class="stat"><b>' + streak + '</b><span>连续天数</span></div>';
  h += '</div></div>';

  h += '<div class="card"><p class="card-title">里程碑</p><p class="card-sub">第一次×××。写下来，以后你会庆幸。</p>';
  h += '<div class="row"><input type="text" id="mileInput" placeholder="第一次自己系鞋带" style="flex:3"><button class="btn btn-sm" id="mileAdd" style="flex:1">添加</button></div>';
  if (S.miles.length) {
    h += '<div style="margin-top:12px">';
    S.miles.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (m) {
      h += '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line)">' +
        '<div><span style="font-size:14px">' + esc(m.text) + '</span><span class="pill gray" style="margin-left:6px">' + esc(m.date.slice(5)) + '</span></div>' +
        '<button class="del" data-del-mile="' + m.id + '">×</button></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card"><p class="card-title">本周小结</p><p class="card-sub">三个问题，周日晚上花五分钟。</p>';
  h += reviewHTML();
  h += '</div>';

  h += '<div class="sec-head"><h2>时间线</h2><span class="more">共 ' + total + ' 条</span></div>';
  h += '<div class="chips" id="gFilter" style="margin-bottom:12px">';
  h += '<button class="chip mini' + (growthFilter === '' ? ' on' : '') + '" data-f="">全部</button>';
  APP_DATA.tags.forEach(function (t) {
    h += '<button class="chip mini' + (growthFilter === t.k ? ' on' : '') + '" data-f="' + t.k + '">' + t.k + '</button>';
  });
  h += '</div>';

  let list = S.entries.slice().sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.createdAt - a.createdAt;
  });
  if (growthFilter) list = list.filter(function (e) { return (e.tags || []).indexOf(growthFilter) >= 0; });

  if (!list.length) {
    h += '<div class="empty">这里还空着。<br>去「今天」写下第一条。</div>';
  } else {
    let curMonth = '';
    h += '<div class="card" style="padding:4px 16px">';
    list.forEach(function (e) {
      const dt = parseDate(e.date);
      const mk = dt.getFullYear() + ' 年 ' + (dt.getMonth() + 1) + ' 月';
      if (mk !== curMonth) {
        h += '<div style="font-size:11.5px;color:var(--ink3);padding:14px 0 4px;border-bottom:1px solid var(--line)">' + mk + ' · ' + weekday(dt) + '</div>';
        curMonth = mk;
      }
      h += entryHTML(e, true);
    });
    h += '</div>';
  }

  $('#page-growth').innerHTML = h;
  bindCommon($('#page-growth'));

  $('#mileAdd').onclick = function () {
    const v = $('#mileInput').value.trim();
    if (!v) return;
    S.miles.push({ id: uid(), date: today(), text: v });
    save(); renderGrowth(); toast('记下了');
  };
  $('#mileInput').onkeydown = function (ev) { if (ev.key === 'Enter') $('#mileAdd').click(); };

  $$('#gFilter .chip').forEach(function (b) {
    b.onclick = function () { growthFilter = b.dataset.f; renderGrowth(); };
  });

  $$('#page-growth [data-review]').forEach(function (ta) {
    ta.onblur = function () {
      const wk = weekKey();
      S.reviews[wk] = S.reviews[wk] || {};
      S.reviews[wk][ta.dataset.review] = ta.value;
      save();
    };
  });
}

function weekKey() {
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return dstr(d);
}

function reviewHTML() {
  const wk = weekKey();
  const r = S.reviews[wk] || {};
  const start = parseDate(wk);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const inWeek = S.entries.filter(function (e) { return e.date >= wk && e.date <= dstr(end); });
  const wkLearn = S.learn.filter(function (l) { return l.date >= wk && l.date <= dstr(end); });
  const doms = {}; wkLearn.forEach(function (l) { doms[l.domain] = 1; });

  let h = '<div class="tip" style="margin-bottom:10px">本周：记录 ' + inWeek.length + ' 条 · 学习 ' + wkLearn.length + ' 笔 · 覆盖 ' + Object.keys(doms).length + '/7 个领域</div>';
  const qs = [['a', '这周他最大的变化是什么？'], ['b', '这周我哪件事做得好？'], ['c', '下周我想调整的一件事？']];
  qs.forEach(function (q) {
    h += '<div class="label">' + q[1] + '</div><textarea data-review="' + q[0] + '" style="min-height:56px;font-size:14px">' + esc(r[q[0]] || '') + '</textarea>';
  });
  return h;
}

/* ---------- 学习 ---------- */

let learnDomain = 'reading';
let picked = [];

function actChip(name, id, domain) {
  const on = picked.some(function (p) { return p.a === name && p.domain === domain; });
  return '<button class="chip' + (on ? ' on' : '') + (id ? ' own' : '') + '" data-act="' + esc(name) + '">' +
    esc(name) + (id ? '<span class="x" data-delact="' + id + '">×</span>' : '') + '</button>';
}

function renderLearn() {
  const d = today();
  const todayLearn = S.learn.filter(function (l) { return l.date === d; })
    .sort(function (a, b) { return b.createdAt - a.createdAt; });
  const dm = APP_DATA.domains.filter(function (x) { return x.id === learnDomain; })[0];

  let h = '';
  h += '<div class="card">';
  h += '<p class="card-title">今天学了什么</p>';
  h += '<p class="card-sub">只记有没有碰到，不打分。勾几项，选时长和状态，一起记下。</p>';
  h += '<div class="chips" id="dmRow">';
  APP_DATA.domains.forEach(function (x) {
    h += '<button class="chip' + (x.id === learnDomain ? ' on' : '') + '" data-dm="' + x.id + '">' + x.name + '</button>';
  });
  h += '</div>';
  h += '<div class="label">' + dm.name + ' · 做了什么</div>';
  h += '<div class="chips" id="actRow">';
  const mine = (S.customActs || []).filter(function (c) { return c.domain === dm.id; });
  dm.acts.forEach(function (a) { h += actChip(a, '', dm.id); });
  mine.forEach(function (c) { h += actChip(c.name, c.id, dm.id); });
  h += '<button class="chip addact" id="btnAddAct">+ 自定义</button>';
  h += '</div>';
  h += '<div id="actForm" style="display:none;margin-top:9px"><div class="row">' +
       '<input type="text" id="actName" placeholder="比如：玩磁力片、看封面猜故事" style="flex:3">' +
       '<button class="btn btn-sm" id="actOK" style="flex:0 0 auto;padding:8px 14px">添加</button></div></div>';
  h += '</div>';

  const n = picked.length;
  h += '<div class="pickbar' + (n ? ' on' : '') + '" id="pickbar">';
  h += '<div class="pickbar-row"><span class="pickbar-label">时长</span>';
  ['15 分钟', '30 分钟', '1 小时+'].forEach(function (t, i) {
    h += '<button class="chip mini' + (pickDur === t ? ' on' : '') + '" data-dur="' + t + '">' + t + '</button>';
  });
  h += '</div>';
  h += '<div class="pickbar-row"><span class="pickbar-label">状态</span>';
  ['投入', '一般', '抗拒'].forEach(function (t) {
    h += '<button class="chip mini' + (pickState === t ? ' on' : '') + '" data-state="' + t + '">' + t + '</button>';
  });
  h += '</div>';
  h += '<div style="margin-top:9px"><button class="btn btn-primary btn-block btn-sm" id="saveLearn">记下这 ' + n + ' 项</button></div>';
  h += '</div>';

  h += '<div class="sec-head"><h2>今天已记</h2></div>';
  if (todayLearn.length) {
    h += '<div class="card">';
    todayLearn.forEach(function (l) {
      const x = APP_DATA.domains.filter(function (y) { return y.id === l.domain; })[0];
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)">' +
        '<div><span class="pill" style="background:' + x.soft + ';color:' + x.color + '">' + x.name + '</span> ' +
        '<span style="font-size:14px">' + esc(l.act) + '</span>' +
        '<div class="tip" style="margin-top:3px">' + esc(l.dur || '') + (l.state ? ' · ' + esc(l.state) : '') + (l.author ? ' · ' + esc(l.author) : '') + '</div></div>' +
        '<button class="del" data-del-learn="' + l.id + '">删除</button></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty" style="padding:14px 8px">今天还没有学习记录</div>';
  }

  h += '<div class="sec-head"><h2>学习地图</h2><span class="more">最近四周</span></div>';
  h += '<div class="card">' + heatHTML() + '<p class="tip" style="margin:12px 0 0">看哪里被漏掉，不是看谁多。连续几周空白的那一行，就是下周该补的一笔。</p></div>';

  h += '<div class="sec-head"><h2>兴趣线索</h2></div>';
  h += '<div class="card">';
  h += '<p class="card-title">他问的问题</p><p class="card-sub">原话记下来。这是最好的学习素材。</p>';
  h += '<div class="row"><input type="text" id="qInput" placeholder="为什么月亮跟着我走" style="flex:3"><button class="btn btn-sm" id="qAdd" style="flex:1">记下</button></div>';
  if (S.questions.length) {
    h += '<div style="margin-top:10px">';
    S.questions.slice().reverse().slice(0, 12).forEach(function (q) {
      h += '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line)">' +
        '<span style="font-size:14px">' + esc(q.text) + '</span>' +
        '<button class="del" data-del-q="' + q.id + '">×</button></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card">';
  h += '<p class="card-title">他反复要做的事</p><p class="card-sub">同一件事被要求第三次，就是强兴趣信号。</p>';

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function weeksBack(n) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  const arr = [];
  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(d); s.setDate(s.getDate() - i * 7);
    arr.push(s);
  }
  return arr;
}

function heatHTML() {
  const ws = weeksBack(4);
  const labels = ['三周前', '两周前', '上周', '本周'];
  let h = '<div class="heat">';
  h += '<div class="heat-row"><div></div>';
  labels.forEach(function (l) { h += '<div class="heat-head">' + l + '</div>'; });
  h += '</div>';
  APP_DATA.domains.forEach(function (dm) {
    h += '<div class="heat-row"><div class="heat-name">' + dm.name + '</div>';
    ws.forEach(function (s) {
      const e = new Date(s); e.setDate(e.getDate() + 7);
      const a = dstr(s), b = dstr(e);
      const c = S.learn.filter(function (l) { return l.domain === dm.id && l.date >= a && l.date < b; }).length;
      const alpha = c === 0 ? 0 : (c === 1 ? 0.16 : (c === 2 ? 0.34 : (c <= 4 ? 0.54 : 0.78)));
      const style = c === 0 ? '' : 'background:' + hexA(dm.color, alpha) + ';color:' + (alpha > 0.5 ? '#fff' : dm.color);
      h += '<div class="heat-cell" style="' + style + '">' + (c || '') + '</div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function decode(text, ctxs) {
  const needScore = {};
  APP_DATA.needs.forEach(function (n) {
    let sc = 0;
    n.kw.forEach(function (k) { if (text.indexOf(k) >= 0) sc += 1.5; });
    needScore[n.id] = sc;
  });
  ctxs.forEach(function (k) {
    const c = APP_DATA.ctxs.filter(function (x) { return x.k === k; })[0];
    if (c) needScore[c.need] = (needScore[c.need] || 0) + c.w;
  });

  const scenes = [];
  APP_DATA.scenes.forEach(function (s) {
    let sc = 0;
    s.kw.split(' ').forEach(function (k) { if (k && text.indexOf(k) >= 0) sc += (k.length >= 2 ? 2 : 1); });
    if (text.indexOf(s.t) >= 0) sc += 5;
    if (sc > 0) scenes.push({ s: s, sc: sc, pr: s.pr || 50 });
  });
  scenes.sort(function (a, b) { return (b.sc - a.sc) || (a.pr - b.pr); });

  let needs = APP_DATA.needs.map(function (n) { return { id: n.id, sc: needScore[n.id] || 0 }; })
    .filter(function (x) { return x.sc > 0; })
    .sort(function (a, b) { return b.sc - a.sc; });

  const generic = !needs.length && !scenes.length;

  if (!needs.length && scenes.length) {
    const map = {
      '情绪爆发': 'overload', '日常对抗': 'escape', '社交冲突': 'incompetent',
      '父母自身': 'overload', '安全与边界': 'power'
    };
    needs = [{ id: map[scenes[0].s.c] || 'overload', sc: 1 }];
  }
  if (!needs.length) needs = [{ id: 'overload', sc: 0 }];

  return {
    text: text, ctx: ctxs.slice(), generic: generic,
    needs: needs.slice(0, 3), sceneId: scenes.length ? scenes[0].s.id : ''
  };
}

/* ---------- 云同步（GitHub 私有仓库 + 本地加密） ---------- */

const SKEY = 'xiaohouzi.sync.v1';
const GH = 'https://api.github.com';
const DATA_PATH = 'data.json';

let SY = { token: '', pass: '', repo: '', salt: '', last: 0, err: '' };
let syncBusy = false;
let pushTimer = null;

function loadSync() {
  try {
    const r = localStorage.getItem(SKEY);
    if (r) SY = Object.assign(SY, JSON.parse(r));
  } catch (e) {}
}
function persistSync() {
  try { localStorage.setItem(SKEY, JSON.stringify(SY)); } catch (e) {}
}
function syncReady() { return !!(SY.token && SY.pass && SY.repo); }
function hasCrypto() { return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }

function queueSync() {
  if (!syncReady() || syncBusy) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () { syncNow(true); }, 6000);
}

/* --- 编解码 --- */
function bytesToB64(bytes) {
  let s = '';
  const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  }
  return btoa(s);
}
function b64ToBytes(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function utf8Bytes(str) { return new TextEncoder().encode(str); }
function bytesUtf8(bytes) { return new TextDecoder().decode(bytes); }

async function deriveKey(saltB64) {
  const base = await crypto.subtle.importKey('raw', utf8Bytes(SY.pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(saltB64), iterations: 120000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptState() {
  if (!SY.salt) {
    SY.salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16)));
    persistSync();
  }
  const key = await deriveKey(SY.salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, utf8Bytes(JSON.stringify(S)));
  return JSON.stringify({ v: 1, salt: SY.salt, iv: bytesToB64(iv), ct: bytesToB64(new Uint8Array(ct)) });
}

async function decryptState(pack) {
  if (!pack || !pack.salt || !pack.ct) throw new Error('远端数据格式不对');
  SY.salt = pack.salt; persistSync();
  const key = await deriveKey(pack.salt);
  let plain;
  try {
    plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(pack.iv) }, key, b64ToBytes(pack.ct));
  } catch (e) {
    throw new Error('口令不一致，解不开远端数据');
  }
  return JSON.parse(bytesUtf8(new Uint8Array(plain)));
}

/* --- GitHub API --- */
function ghHeaders() {
  return {
    Authorization: 'Bearer ' + SY.token,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}

function cleanRepo(v) {
  return String(v || '').trim()
    .replace(/^https?:\/\/(www\.)?github\.com\//i, '')
    .replace(/\.git$/i, '')
    .replace(/[?#].*$/, '')
    .replace(/\/+$/, '')
    .replace(/\s+/g, '');
}

async function ghWhoAmI() {
  const r = await fetch(GH + '/user', { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 401) throw new Error('令牌无效，检查是否复制完整');
  if (!r.ok) throw new Error('连不上 GitHub（' + r.status + '）');
  return (await r.json()).login;
}

/* 分步检查：令牌 → 仓库 → 权限。哪一步断了就停在哪一步。 */
async function checkConn() {
  const lines = [];
  const push = function (ok, txt) { lines.push({ ok: ok, txt: txt }); };
  try {
    const r = await fetch(GH + '/user', { headers: ghHeaders(), cache: 'no-store' });
    if (r.status === 401) {
      push(false, '令牌无效：可能复制不完整，或已经过期');
      return { ok: false, lines: lines };
    }
    if (!r.ok) {
      push(false, '连不上 GitHub（' + r.status + '），先确认网络');
      return { ok: false, lines: lines };
    }
    const me = (await r.json()).login;
    push(true, '令牌有效，账号 ' + me);

    if (!SY.repo || SY.repo.indexOf('/') < 0) {
      push(false, '数据仓库没填对，应该是「用户名/仓库名」');
      return { ok: false, lines: lines };
    }
    const owner = SY.repo.split('/')[0];
    if (owner.toLowerCase() !== String(me).toLowerCase()) {
      push(false, '仓库属于 ' + owner + '，但令牌是 ' + me + ' 的账号，对不上');
      return { ok: false, lines: lines };
    }

    const rp = await fetch(GH + '/repos/' + SY.repo, { headers: ghHeaders(), cache: 'no-store' });
    if (rp.status === 404) {
      push(false, '找不到仓库 ' + SY.repo + '：要么名字写错，要么建令牌时没把这个仓库勾进去');
      return { ok: false, lines: lines };
    }
    if (!rp.ok) {
      push(false, '读不到仓库信息（' + rp.status + '）');
      return { ok: false, lines: lines };
    }
    const j = await rp.json();
    push(true, '仓库存在：' + j.full_name + (j.private ? '（私有）' : '（公开）'));
    if (!j.permissions || !j.permissions.push) {
      push(false, '令牌只有读权限：权限里要把 Contents 改成 Read and write');
      return { ok: false, lines: lines };
    }
    push(true, '有写入权限');
    return { ok: true, lines: lines };
  } catch (e) {
    push(false, '网络错误：' + (e.message || '连不上 GitHub'));
    return { ok: false, lines: lines };
  }
}

function renderCheck(lines) {
  const el = $('#syMsg');
  if (!el) return;
  el.innerHTML = lines.map(function (l) {
    return '<div class="chk ' + (l.ok ? 'ok' : 'bad') + '">' + (l.ok ? '✓' : '✕') + ' ' + esc(l.txt) + '</div>';
  }).join('');
}

async function ghRead() {
  const r = await fetch(GH + '/repos/' + SY.repo + '/contents/' + DATA_PATH + '?t=' + Date.now(),
    { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error('令牌无效，或没有这个仓库的权限');
  if (r.status === 403) throw new Error('令牌权限不足，需要 Contents 读写');
  if (!r.ok) throw new Error('读取失败（' + r.status + '）');
  const j = await r.json();
  return { text: bytesUtf8(b64ToBytes(j.content || '')), sha: j.sha };
}

async function ghWrite(text, sha) {
  const body = { message: 'sync ' + new Date().toISOString(), content: bytesToB64(utf8Bytes(text)) };
  if (sha) body.sha = sha;
  const r = await fetch(GH + '/repos/' + SY.repo + '/contents/' + DATA_PATH, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
  });
  if (r.ok) return true;
  if (r.status === 409 || r.status === 422) return false;   // 别人刚提交过，冲突
  if (r.status === 401) throw new Error('令牌无效或已过期');
  if (r.status === 403) throw new Error('令牌没有写入权限');
  if (r.status === 404) throw new Error('写不进去：点「检查连接」看是仓库还是权限的问题');
  throw new Error('上传失败（' + r.status + '）');
}

/* --- 同步主流程 --- */
async function syncNow(silent) {
  if (!syncReady()) {
    if (!silent) { toast('先填好令牌和口令'); openSync(); }
    return;
  }
  if (!hasCrypto()) { if (!silent) toast('这个浏览器不支持加密，换 Safari/Chrome 打开'); return; }
  if (syncBusy) return;
  syncBusy = true;
  clearTimeout(pushTimer);
  try {
    let remote = await ghRead();
    let added = 0;
    let sha = null;
    if (remote) {
      const pack = JSON.parse(remote.text);
      const obj = await decryptState(pack);
      added = mergeObj(obj);
      sha = remote.sha;
      if (added) saveLocal();
    }
    let ok = await ghWrite(await encryptState(), sha);
    if (!ok) {
      // 撞车了：重新拉一次合并，再写回
      const again = await ghRead();
      if (again) {
        const obj2 = await decryptState(JSON.parse(again.text));
        const more = mergeObj(obj2);
        added += more;
        if (more) saveLocal();
        sha = again.sha;
      }
      ok = await ghWrite(await encryptState(), sha);
      if (!ok) throw new Error('同时有人写入，稍后再试一次');
    }
    SY.last = Date.now(); SY.err = ''; persistSync();
    renderAll();
    if (!silent) toast(added ? '同步完成，收到 ' + added + ' 条新内容' : '同步完成，已是最新');
  } catch (e) {
    SY.err = e.message || '同步失败'; persistSync();
    if (!silent) {
      toast(SY.err);
      const el = $('#syMsg');
      if (el) el.innerHTML += '<div class="chk bad">✕ ' + esc(SY.err) + '</div>';
    }
  }
  syncBusy = false;
}

/* --- 同步设置面板 --- */
function fmtTime(ts) {
  if (!ts) return '还没同步过';
  const d = new Date(ts);
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return '刚刚';
  if (diff < 60) return diff + ' 分钟前';
  return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

    await syncNow(false);
    if (!SY.err) {
      renderCheck(chk.lines.concat([{ ok: true, txt: '同步完成 ' + fmtTime(Date.now()) }]));
      toast('同步成功');
    } else {
      renderCheck(chk.lines.concat([{ ok: false, txt: SY.err }]));
    }
  };
  $('#syCheck').onclick = async function () {
    SY.token = $('#syTok').value.trim();
    SY.repo = cleanRepo($('#syRepo').value);
    if (!SY.token) { toast('先把令牌填上'); return; }
    persistSync();
    if (!SY.repo) {
      try { SY.repo = (await ghWhoAmI()) + '/xiaohouzi-data'; persistSync(); }
      catch (e) { toast(e.message); return; }
    }
    $('#syRepo').value = SY.repo;
    const chk = await checkConn();
    renderCheck(chk.lines);
    if (!$('#syMsg')) toast('检查完了');
  };
  $('#syCopyCfg').onclick = function () {
    const t = $('#syTok').value.trim(), p = $('#syPass').value, r = $('#syRepo').value.trim();
    if (!t || !p) { toast('先把令牌和口令填上'); return; }
    const blob = bytesToB64(utf8Bytes(JSON.stringify({ t: t, p: p, r: r })));
    $('#syCfg').value = blob;
    $('#syCfg').select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(blob).then(function () { toast('已复制，发给爸爸'); })
        .catch(function () { toast('已选中，长按复制'); });
    } else { toast('已选中，长按复制'); }
  };
  $('#syPasteCfg').onclick = function () {
    const v = $('#syCfg').value.trim();
    if (!v) { toast('先把爸爸发来的那段贴进框里'); return; }
    try {
      const o = JSON.parse(bytesUtf8(b64ToBytes(v)));
      if (!o.t || !o.p) throw new Error('bad');
      $('#syTok').value = o.t;
      $('#syPass').value = o.p;
      if (o.r) $('#syRepo').value = o.r;
      toast('已填入，点「保存并同步」');
    } catch (e) { toast('这段内容读不出来'); }
  };
  if ($('#syOff')) $('#syOff').onclick = function () {
    if (!confirm('断开后本机不再自动同步，已有记录不会删除。')) return;
    SY.token = ''; SY.pass = ''; SY.repo = ''; SY.salt = ''; SY.last = 0; SY.err = '';
    persistSync(); openSync(); toast('已断开');
  };
}

/* ---------- 启动 ---------- */

function init() {
  load();
  loadSync();
  if (S.child && S.child.name) {
    document.title = S.child.name + '成长记';
    $('#brandName').textContent = S.child.name + '成长记';
    $('#appleTitle') && $('#appleTitle').setAttribute('content', S.child.name + '成长记');
  }
  $$('.nav-item').forEach(function (b) {
    b.onclick = function () { go(b.dataset.tab); };
  });
  $('#btnMenu').onclick = openMenu;
  $('#mask').onclick = function (e) { if (e.target === $('#mask')) closeSheet(); };
  window.addEventListener('scroll', function () {
    $('.topbar').classList.toggle('scrolled', window.scrollY > 4);
  });
  if (memOnly) toast('浏览器不允许本地存储，记录不会保存');
  const h = (location.hash || '').replace('#', '');
  go(['today', 'growth', 'learn', 'guide', 'scene'].indexOf(h) >= 0 ? h : 'today');

  if (syncReady()) setTimeout(function () { syncNow(true); }, 1500);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && syncReady() && Date.now() - SY.last > 20000) syncNow(true);
  });
  window.addEventListener('online', function () { if (syncReady()) syncNow(true); });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
